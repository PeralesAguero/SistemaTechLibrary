<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechLibrary</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Tu CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔝 NAVBAR -->
<nav class="navbar navbar-expand-lg shadow">
    <div class="container">
        <a class="navbar-brand">
            <i class="bi bi-book"></i> TechLibrary
        </a>
    </div>
</nav>

<!-- 🌐 CONTENIDO -->
<div class="container mt-5">

    <!-- 🎯 TÍTULO -->
    <div class="text-center mb-4">
        <h1>Bienvenido a TechLibrary</h1>
        <p class="text-light">Sistema de gestión de biblioteca digital</p>
    </div>

    <!-- 👤 REGISTRO -->
    <div class="card p-4 mx-auto" style="max-width: 800px;">

        <h2 class="text-center mb-4">
            <i class="bi bi-person-plus"></i> Registrar Usuario
        </h2>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ingrese su nombre">
            </div>

            <div class="col-md-6">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="Ingrese su email">
            </div>

            <div class="col-12">
                <button class="btn btn-primary w-100 mt-3" onclick="crearUsuario()">
                    <i class="bi bi-save"></i> Registrar Usuario
                </button>
            </div>

        </div>

    </div>

    <!-- 📊 FUTURO ESPACIO -->
    <div class="text-center mt-5">
        <p class="text-secondary">Próximamente: Catálogo de libros, préstamos y más...</p>
    </div>

</div>

<!-- ⚙️ JS -->
<script src="app.js"></script>

</body>
</html>
